<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Notes — Photography</title>
<meta name="description" content="A photography portfolio of wildlife, concerts, and events.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header" id="top">
  <div class="brand">
    <span class="brand-name">Eva Kastoun</span>
    <span class="brand-tag">field notes / photography</span>
  </div>
  <nav class="site-nav">
    <a href="#animals">Animals</a>
    <!-- HIDDEN SECTION: un-comment these two links once you've added concert / event photos to script.js
    <a href="#concerts">Concerts</a>
    <a href="#events">Events</a>
    -->
  </nav>
  <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</header>

<section class="hero">
  <img src="images/hero-humpback-whale.jpg" alt="A humpback whale breaching" class="hero-img" fetchpriority="high">
</section>

<main>

  <section class="gallery-section" id="animals">
    <div class="section-head">
      <h2>Animals</h2>
    </div>
    <div class="gallery-grid" data-gallery="animals"></div>
  </section>

  <!-- HIDDEN SECTION: add photos to `concerts` and `events` in script.js,
       then delete this comment marker and the closing one below to show them.

  <section class="gallery-section" id="concerts">
    <div class="section-head">
      <h2>Concerts</h2>
      <p class="section-note">New ground. Logged by artist, venue, and date.</p>
    </div>
    <div class="gallery-grid" data-gallery="concerts"></div>
  </section>

  <section class="gallery-section" id="events">
    <div class="section-head">
      <h2>Events</h2>
      <p class="section-note">Logged by occasion, location, and date.</p>
    </div>
    <div class="gallery-grid" data-gallery="events"></div>
  </section>

  END HIDDEN SECTION -->


</main>

<footer class="site-footer">
  <p>&copy; 2026 Eva Kastoun. All photographs are original work.</p>
  <a href="#top" class="back-to-top">Back to top ↑</a>
</footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
  <img src="" alt="" id="lightboxImg">
  <p id="lightboxCaption"></p>
</div>

<script src="script.js"></script>
</body>
</html>
